[package]
name = "crdt-bench"
version = "0.1.0"
edition = "2024"
default-run = "crdt-bench"

[dependencies]
anyhow = "1.0.104"
automerge = "0.12.0" # { path = "../automerge/rust/automerge" } # change to 0.6.0 for automerge 2 and 0.12.0 for 3
# The upstream `hashless` branch, imported under another name so it can sit
# beside the release above. The battery runs its hash-light documents
# (`next::AutoCommit` on the branch) as "automerge-hashless".
# Bump with: cargo update -p automerge_hashless (or change `rev`).
automerge_hashless = { package = "automerge", git = "https://github.com/automerge/automerge", rev = "61271d3eb1f945461ee4de36f012b97da5568cbd" }
clap = { version = "4.6.8", features = ["derive"] }
criterion = "0.8.1"
dhat = "0.3.3"
divan = "0.1.21"
json = "0.12.4"
pprof = {version = "0.15.0", features = ["flamegraph"]}
rand = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
yrs = "0.28.1"


# [profile.release]
# debug = true  # Include debug symbols for your code

# # Ensure all dependencies also have debug symbols for complete stack traces
# [profile.release.package."*"]
# debug = true


[[bench]]
name = "load"
harness = false

[[bench]]
name = "seq_add"
harness = false

[[bench]]
name = "conc_add"
harness = false

[[bench]]
name = "mem"
harness = false

[[bench]]
name = "version"
harness = false

[[bench]]
name = "real"
harness = false

[features]
dhat-heap = [] # if you are doing heap profiling
# Install a tracking allocator so the battery can run its memory benchmarks.
memory = []
